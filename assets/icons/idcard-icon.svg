<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icon: tarjeta de identificación con franjas de la bandera de Venezuela -->
  <defs>
    <clipPath id="cardClip">
      <rect x="32" y="96" rx="28" ry="28" width="448" height="320" />
    </clipPath>
  </defs>

  <!-- Fondo general -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Tarjeta con franjas -->
  <g clip-path="url(#cardClip)">
    <!-- Top stripe: Amarillo -->
    <rect x="32" y="96" width="448" height="106.666" fill="#FFD100" />
    <!-- Middle stripe: Azul -->
    <rect x="32" y="202.666" width="448" height="106.666" fill="#0D2B90" />
    <!-- Bottom stripe: Rojo -->
    <rect x="32" y="309.332" width="448" height="106.666" fill="#CE1126" />

    <!-- Contorno de la tarjeta -->
    <rect x="32" y="96" rx="28" ry="28" width="448" height="320" fill="none" stroke="#111" stroke-opacity="0.08" stroke-width="2" />

    <!-- Área de foto a la izquierda -->
    <rect x="56" y="142" width="112" height="160" rx="8" ry="8" fill="#ffffff" stroke="#000" stroke-opacity="0.06" />
    <rect x="64" y="150" width="96" height="144" rx="6" ry="6" fill="#e6e6e6" />

    <!-- Texto indicativo pequeño (simboliza texto de la tarjeta) -->
    <rect x="184" y="150" width="272" height="20" rx="4" ry="4" fill="#ffffff" opacity="0.6"/>
    <rect x="184" y="180" width="220" height="16" rx="3" ry="3" fill="#ffffff" opacity="0.55"/>
    <rect x="184" y="204" width="140" height="16" rx="3" ry="3" fill="#ffffff" opacity="0.55"/>

    <!-- Estrellas blancas sobre la franja azul (simplificadas) -->
    <g transform="translate(240,250) scale(0.7)" fill="#ffffff">
      <polygon points="0,-12 3,-4 11,-4 5,1 8,9 0,4 -8,9 -5,1 -11,-4 -3,-4" />
      <polygon points="48,-12 51,-4 59,-4 53,1 56,9 48,4 40,9 43,1 37,-4 45,-4"/>
      <polygon points="96,-12 99,-4 107,-4 101,1 104,9 96,4 88,9 91,1 85,-4 93,-4"/>
    </g>

  </g>

  <!-- Sombra suave debajo de la tarjeta -->
  <ellipse cx="256" cy="436" rx="160" ry="22" fill="#000" opacity="0.06" />

</svg>
